application.instance-name=${INSTANCE_NAME:notification-instance-0}
spring.application.name=notification
spring.threads.virtual.enabled=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:8080}

kafka.bootstrap-servers=${KAFKA_SERVER:localhost:9092}
mongo.uri=${MONGO_URI:mongodb://admin:admin@localhost:27017/notification?authSource=admin}

spring.main.allow-bean-definition-overriding=true