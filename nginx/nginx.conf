events {}

http {

    upstream backend-cluster-roundrobin {
        server host.docker.internal:9090;
        server host.docker.internal:9091;
    }

    upstream backend-cluster-sticky {
        ip_hash;
        server host.docker.internal:9090;
        server host.docker.internal:9091;
    }

    server {
        listen 80;

        location /api/v1 {
            proxy_pass http://backend-cluster-roundrobin;
            proxy_http_version 1.1;
        }

        location /sse {
            proxy_pass http://backend-cluster-sticky;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
        }

        location /ws {
            proxy_pass http://backend-cluster-sticky;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_read_timeout 3600;
        }
    }
}