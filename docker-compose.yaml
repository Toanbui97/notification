version: "3.8"

services:
  redis:
    image: docker.io/bitnami/redis:7.4
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
    container_name: redis-notification
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - REDIS_DISABLE_COMMANDS=FLUSHDB,FLUSHALL
    ports:
      - '6379:6379'
#    volumes:
#      - ./data/redis:/bitnami/redis/data
  kafka:
    image: 'bitnami/kafka:latest'
    container_name: kafka-notification
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka-notification:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://host.docker.internal:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
    ports:
      - "9092:9092"
#    volumes:
#      - ./data/kafka:/bitnami
#
  mongodb:
    image: mongo:latest
    container_name: mongo-notification
    ports:
      - "27017:27017"
#    volumes:
#      - ./data/mongo:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: notification

  notification-1:
    image: notification:1.0-SNAPSHOT
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1g
    container_name: notification-1
    environment:
      - INSTANCE_NAME=instance-1
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - KAFKA_SERVER=host.docker.internal:9092
      - MONGO_URI=mongodb://admin:admin@host.docker.internal:27017/notification?authSource=admin
    ports:
      - '9090:8080'

  notification-2:
    image: notification:1.0-SNAPSHOT
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1g
    container_name: notification-2
    environment:
      - INSTANCE_NAME=instance-2
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - KAFKA_SERVER=host.docker.internal:9092
      - MONGO_URI=mongodb://admin:admin@host.docker.internal:27017/notification?authSource=admin
    ports:
      - '9091:8080'

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      - notification-1
      - notification-2
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  data:
    driver: local