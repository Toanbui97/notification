version: "3.8"

services:
  redis:
    image: docker.io/bitnami/redis:7.4
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
    container_name: redis-notification
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - REDIS_DISABLE_COMMANDS=FLUSHDB,FLUSHALL
    ports:
      - '6379:6379'
#    volumes:
#      - ./data/redis:/bitnami/redis/data
  kafka:
    image: bitnami/kafka:latest
    container_name: kafka-notification
    environment:
      - KAFKA_CLUSTER_ID=lkorDA4qT6W1K_dk0LHvtg
      # Start Kraft Setup (Kafka as Controller - no Zookeeper)
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_BROKER_ID=1
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@127.0.0.1:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LOG_DIRS=/tmp/logs
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:9094
      # End Kraft Specific Setup
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka:9094,PLAINTEXT://kafka:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
    ports:
      - "9092:9092"

  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: kafka-ui-notification
    ports:
      - "8081:8080"
    restart: "always"
    environment:
      KAFKA_CLUSTERS_0_NAME: "lkorDA4qT6W1K_dk0LHvtg"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9094
    depends_on:
      - kafka

  mongodb:
    image: mongo:latest
    container_name: mongo-notification
    ports:
      - "27017:27017"
#    volumes:
#      - ./data/mongo:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: notification

  notification-1:
    image: notification:2.0-SNAPSHOT
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1g
    container_name: notification-1
    depends_on:
      - kafka
    environment:
      - INSTANCE_NAME=instance-1
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - KAFKA_SERVER=kafka:9092
      - MONGO_URI=mongodb://admin:admin@host.docker.internal:27017/notification?authSource=admin
    ports:
      - '9090:8080'

  notification-2:
    image: notification:2.0-SNAPSHOT
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1g
    container_name: notification-2
    depends_on:
      - kafka
    environment:
      - INSTANCE_NAME=instance-2
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - KAFKA_SERVER=kafka:9092
      - MONGO_URI=mongodb://admin:admin@host.docker.internal:27017/notification?authSource=admin
    ports:
      - '9091:8080'

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      - notification-1
      - notification-2
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  data:
    driver: local
